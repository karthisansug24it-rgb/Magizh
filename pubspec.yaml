name: magizh_pos_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0-0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  supabase_flutter: ^2.12.4
  google_fonts: ^8.1.0
  flutter_riverpod: ^3.3.1
  cached_network_image: ^3.4.1
  audioplayers: ^6.6.0
  image_picker: ^1.2.2
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  flutter_staggered_animations: ^1.1.1
  uuid: ^4.5.3
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/sound/tap.mp3
    - assets/images/magizh_logo.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0a261a"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
