name: iOS Build Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by some plugins)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create real .env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: echo "$ENV_FILE_CONTENT" > .env

      - name: Build iOS (Simulator)
        # This compiles the app for the iOS simulator to verify all plugins and code work,
        # completely bypassing the Apple Developer certificate signing step.
        run: flutter build ios --simulator

      - name: Zip the Simulator payload
        # Appetize.io expects the .app folder to be at the root of the .zip file
        run: |
          cd build/ios/iphonesimulator
          zip -q -r SimulatorApp.zip Runner.app
          
      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/iphonesimulator/SimulatorApp.zip

      - name: Disable Code Signing for Physical Device Build
        # This forces Xcode to ignore the missing Development Team when building for physical devices
        run: |
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig

      - name: Build iOS (Unsigned Device IPA)
        run: flutter build ios --release --no-codesign

      - name: Zip the Unsigned IPA payload
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -q -r Magizh_Unsigned.ipa Payload
          
      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/iphoneos/Magizh_Unsigned.ipa
