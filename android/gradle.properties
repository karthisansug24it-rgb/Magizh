# Performance Boosters
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=1G -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Workaround for Kotlin incremental cache failures on Windows when project and
# Pub cache are on different drives (e.g., D: project and C: Pub cache).
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# Android Settings
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
# Flutter SDK versions
flutter.compileSdkVersion=36
flutter.targetSdkVersion=36
flutter.minSdkVersion=24
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=true
